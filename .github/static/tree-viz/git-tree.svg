    <circle class="commit-leaf" cx="600" cy="500" r="10" fill="url(#mergeGradient)" stroke="#7c3aed" stroke-width="1.5"><title>838b9c4: Merge pull request #1 from XAOSTECH/anglicise/20260401-002733</title></circle>
